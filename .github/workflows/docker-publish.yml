# Build and publish the private FastAPI ML image to GitHub Container Registry.
# Intended for private/internal Azure (or similar) pull — not public ingress.
# Does not deploy, does not expose student data, and keeps ML_OPERATING_MODE=synthetic_demo.
name: Publish ML image to GHCR

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-ml-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/mujahidjuel3/academic-sentinel-ml
  ML_OPERATING_MODE: synthetic_demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and prepare synthetic demo artifacts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          PYTHONPATH=. python scripts/prepare_demo_artifacts.py --rows 200 --seed 2026
          test -f artifacts/model.joblib
          test -f artifacts/metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("artifacts/metadata.json").read_text(encoding="utf-8"))
          assert meta.get("isSynthetic") is True, meta
          assert meta.get("operatingMode") == "synthetic_demo", meta
          print("synthetic demo artifacts ready:", meta.get("modelVersion"))
          PY

      - name: Run pytest
        run: PYTHONPATH=. python -m pytest -q

      - name: Set lowercase image owner
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/academic-sentinel-ml" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build and push ML image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
